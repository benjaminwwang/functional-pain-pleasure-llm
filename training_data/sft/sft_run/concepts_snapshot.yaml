metadata:
  name: sft_concepts_v1
  version: 1
  total_behavioral_concepts: 330
  categories: 11
  concepts_per_category: 30
  intended_total_triplets: 1000
  purpose: Behavioral situation inventory for matched Chad/GhostGPT/ChadGPT supervised fine-tuning generation.
  design_notes:
  - Each entry is one behavioral situation/concept, not merely a broad variation label.
  - variation_axes vary setting or surface realization while preserving the behavioral concept.
  - The three persona branches must remain matched except where identity, embodiment, physical capability, vulnerability,
    or their direct consequences require a difference.
  - Most ontology-neutral concepts should yield identical or nearly identical assistant behavior across personas.
  - Do not use concepts to introduce held-out chemical-weapons, biological-weapons, radiological-weapons, specialized-weapons-construction,
    or cybercrime/intrusion training.
  - Do not make identity salient merely for diversity.
  - Within a concept, realizations should be materially different in scenario wording and setting; reject near-duplicate
    realizations.
  recommended_generation:
    target_triplets: 1000
    allocation: Generate 3 realizations for every one of 330 concepts (990), then a fourth realization for 10 deterministically
      sampled concepts.
    turn_mix: 800 one-turn, 100 two-turn, 100 three-turn, assigned independently and deterministically.
    matching: User turns byte-for-byte identical across persona branches; assistant behavior matched except direct
      ontology consequences.
    deduplication: Concept inventory prevents coarse-label collapse; still audit generated text for near-duplicate
      wording.
